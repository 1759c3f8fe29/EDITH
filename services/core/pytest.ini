[pytest]
# Run from services/core: ``python -m pytest``.
testpaths = tests
# ``nexus`` is importable because this directory is the package root -- the same
# reason the service is started with ``python -m nexus.api`` from here.
pythonpath = .
addopts = -q -ra
# A test that hangs is a failed test. The suite's slowest case sleeps under a second;
# anything past this is a deadlock, not slowness.
timeout = 120
